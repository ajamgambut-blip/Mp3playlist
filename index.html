<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyMusic">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>MyMusic</title>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1>MyMusic</h1>
    <p id="status">Offline Music Player</p>
  </div>
  <button id="addBtn">＋</button>
</header>

<section class="player">

  <div class="cover" id="cover">♪</div>

  <h2 id="title">Belum ada lagu</h2>
  <p id="artist">Tambahkan musik untuk mulai</p>

  <div class="progress">
    <span id="cur">0:00</span>
    <input id="bar" type="range" min="0" max="100" value="0">
    <span id="dur">0:00</span>
  </div>

  <div class="controls">
    <button id="prev">⏮</button>
    <button id="play">▶</button>
    <button id="next">⏭</button>
  </div>

  <div class="sub">
    <button id="shuffle">🔀</button>
    <button id="repeat">🔁</button>
  </div>

</section>

<section id="panel">

  <label class="file">
    📁 Tambah File
    <input id="files" type="file"
      accept="audio/*,video/mp4,.mp3,.wav,.m4a,.aac"
      multiple>
  </label>

  <div class="search">
    <input id="query" placeholder="Cari musik di YouTube...">
    <button id="searchBtn">Cari</button>
  </div>

  <div id="results"></div>

</section>

<section class="library">

  <div class="libhead">
    <div>
      <h3>Library</h3>
      <small id="count">0 lagu</small>
    </div>
    <button id="clear">Hapus</button>
  </div>

  <div id="playlist"></div>

</section>

<audio id="audio" playsinline preload="metadata"></audio>
<div id="youtubePlayer"></div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>

  <script>

    <!-- TOMBOL BUKA RADIO -->
<button onclick="document.getElementById('radioBox').style.display='block'; renderRadio()" 
  style="width:100%; padding:12px; margin:12px 0; background:#1DB954; color:#000; border:none; border-radius:12px; font-weight:700; font-size:16px;">
  📻 Buka Radio Hits
</button>

<!-- KOTAK RADIO -->
<div id="radioBox" style="display:none; background:#111; padding:12px; border-radius:16px; margin:12px 0;">
  <input id="radioSearch" oninput="searchRadio()" placeholder="Cari radio..." 
    style="width:100%; padding:10px; border-radius:8px; border:none; margin-bottom:10px; background:#222; color:#fff;">
  <div id="radioList"></div> <!-- INI YANG KURANG TADI -->
  <button onclick="document.getElementById('radioBox').style.display='none'" 
    style="width:100%; margin-top:10px; padding:8px; background:#333; color:#fff; border:none; border-radius:8px;">Tutup</button>
</div>

<!-- BAR NOW PLAYING -->
<div id="nowPlayingRadio" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#1DB954; color:#000; padding:10px; display:flex; align-items:center; gap:10px;">
  <img id="radioLogo" src="" style="width:40px; height:40px; border-radius:6px;">
  <b id="radioName">Radio</b>
  <button onclick="stopRadio()" style="margin-left:auto; background:#000; color:#fff; border:none; padding:6px 12px; border-radius:8px;">Stop</button>
</div>

<!-- AUDIO KHUSUS RADIO -->
<audio id="radioPlayer"></audio>
// DATA RADIO
const radioList = [
  {name:"Prambors FM", city:"Jakarta", url:"https://stream.zeno.fm/0r0a792kwz8uv", logo:"https://img2.gratispng.com/20191121/sj/transparent-prambors-radio-5dd5a9a6b2b0d1.9084561815746410627309.jpg"},
  {name:"Gen FM", city:"Jakarta", url:"https://stream.zeno.fm/u4b3nq6e6y0uv", logo:"https://upload.wikimedia.org/wikipedia/id/9/9c/Logo_Gen_98.7_FM.png"},
  {name:"Cirebon FM", city:"Cirebon", url:"https://stream.zeno.fm/8q3x3v8k6y0uv", logo:"https://i.imgur.com/8Kk3Q9p.png"}
];

// FUNGSI NAMPILIN
function renderRadio(list = radioList){
  console.log("renderRadio jalan", list.length); // buat debug
  const container = document.getElementById('radioList');
  container.innerHTML = '';
  list.forEach(radio => {
    container.innerHTML += `<div onclick="playRadio('${radio.name}', '${radio.url}', '${radio.logo}')" style="display:flex; align-items:center; gap:12px; padding:10px; background:#222; border-radius:12px; cursor:pointer; color:#fff; margin-bottom:8px;">
  <img src="${radio.logo}" style="width:50px; height:50px; border-radius:8px;">
  <div><b>${radio.name}</b><br><small style="color:#aaa;">${radio.city}</small></div>
  <span style="margin-left:auto;">▶️</span>
</div>`;
  });
}

    
// FUNGSI PLAY
function playRadio(name, url, logo){
  const audio = document.getElementById('radioPlayer');
  audio.src = url; 
  audio.play().then(()=>{
    document.getElementById('nowPlayingRadio').style.display = 'flex';
    document.getElementById('radioName').innerText = "🔴 LIVE: " + name;
    document.getElementById('radioLogo').src = logo;
  }).catch(err => alert("Gagal play: " + err));
}

// FUNGSI STOP
function stopRadio(){
  const audio = document.getElementById('radioPlayer');
  audio.pause(); audio.src='';
  document.getElementById('nowPlayingRadio').style.display = 'none';
}

// FUNGSI CARI
function searchRadio(){
  const q = document.getElementById('radioSearch').value.toLowerCase();
  renderRadio(radioList.filter(r => r.name.toLowerCase().includes(q) || r.city.toLowerCase().includes(q)));
}
</script>

  
</body>
</html>
