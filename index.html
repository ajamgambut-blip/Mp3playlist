<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusikKu Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="player">
    <img id="cover" src="https://via.placeholder.com/300" alt="cover">
    <h2 id="title">Pilih Lagu</h2>
    <p id="artist">MusikKu Pro</p>

    <div class="online-box">
      <input type="text" id="searchInput" placeholder="Cari lagu di YouTube...">
      <button id="searchBtn">🔍 Cari</button>
    </div>
    <div id="searchResult"></div>

    <audio id="audio"></audio>
    <div class="progress">
      <span id="current">0:00</span>
      <input type="range" id="progress" value="0">
      <span id="duration">0:00</span>
    </div>
    <div class="controls">
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>
  </div>
  <iframe id="yt-player" style="display:none" allow="autoplay"></iframe>
<script src="script.js"></script>
</body>
</html>
