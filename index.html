<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusikKu Pro 2.0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="player">
    <div class="cover-box">
      <img id="cover" src="https://via.placeholder.com/300/1a1a1a/fff?text=MusikKu" alt="cover">
      <div class="glow"></div>
    </div>
    <h2 id="title">Belum ada lagu</h2>
    <p id="artist">MusikKu Pro 2.0</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('online')">Online</button>
      <button class="tab-btn" onclick="showTab('offline')">Offline</button>
    </div>

    <div id="online-tab" class="tab">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari lagu di YouTube...">
        <button id="searchBtn">🔍</button>
      </div>
      <div id="searchResult"></div>
    </div>

    <div id="offline-tab" class="tab" style="display:none">
      <label for="fileInput" class="btn-upload">➕ Tambah Lagu dari File</label>
      <input type="file" id="fileInput" accept="audio/*" multiple style="display:none">
      <div id="offlineList"></div>
    </div>

    <audio id="audio"></audio>
    <div class="progress">
      <span id="current">0:00</span>
      <input type="range" id="progress" value="0">
      <span id="duration">0:00</span>
    </div>
    <div class="controls">
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
