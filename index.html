<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1DB954">
  <title>MusikKu Offline</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-512.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="player">
    <img id="coverArt" src="./icon-512.png" alt="Cover">
    <h2 id="songTitle">Belum ada lagu</h2>
    <p id="songArtist">-</p>

    <canvas id="visualizer"></canvas>

    <input type="range" id="progressBar" value="0" max="100">

    <div class="controls">
      <button id="prevBtn">⏮️</button>
      <button id="playBtn">▶️</button>
      <button id="nextBtn">⏭️</button>
    </div>

    <button id="addSongBtn">+ Tambah Lagu</button>
    <input type="file" id="fileInput" accept="audio/*" multiple hidden>

    <ul id="playlist"></ul>
  </div>

  <audio id="audioPlayer" playsinline webkit-playsinline></audio>
  <script src="./script.js"></script>
</body>
</html>
