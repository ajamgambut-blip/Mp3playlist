<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MusikKu Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>
<div class="player">
  <img id="cover" src="icon-512.png">
  <canvas id="visualizer"></canvas>
  <h2 id="title">MusikKu Pro</h2>
  <p id="artist">Mode Offline</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="offline">Offline</button>
    <button class="tab-btn" data-tab="online">Cari YouTube</button>
    <button class="tab-btn" data-tab="playlist">Playlist</button>
  </div>

  <div id="offline-tab" class="tab-content">
    <label class="btn"><input type="file" id="fileInput" accept="audio/*,video/*" multiple hidden>➕ Tambah MP3 / MP4 / WAV</label>
    <div id="offlineList" class="list"></div>
  </div>

  <div id="online-tab" class="tab-content" style="display:none">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari lagu di YouTube...">
      <button id="searchBtn">🔍</button>
    </div>
    <p style="font-size:12px;color:#aaa;text-align:center;margin-bottom:10px">Klik hasil untuk buka di YouTube</p>
    <div id="searchResult" class="list"></div>
  </div>

  <div id="playlist-tab" class="tab-content" style="display:none">
    <div id="playlistList" class="list"></div>
  </div>

  <audio id="audio" playsinline></audio>
  <div class="progress"><span id="current">0:00</span><input type="range" id="progress" value="0"><span id="duration">0:00</span></div>
  <div class="controls">
    <button id="repeat">🔁</button><button id="prev">⏮</button><button id="play">▶</button><button id="next">⏭</button><button id="shuffle">🔀</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
