<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyMusic">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>MyMusic</title>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1>MyMusic</h1>
    <p id="status">Offline Music Player</p>
  </div>
  <button id="addBtn">＋</button>
</header>

<section class="player">

  <div class="cover" id="cover">♪</div>

  <h2 id="title">Belum ada lagu</h2>
  <p id="artist">Tambahkan musik untuk mulai</p>

  <div class="progress">
    <span id="cur">0:00</span>
    <input id="bar" type="range" min="0" max="100" value="0">
    <span id="dur">0:00</span>
  </div>

  <div class="controls">
    <button id="prev">⏮</button>
    <button id="play">▶</button>
    <button id="next">⏭</button>
  </div>

  <div class="sub">
    <button id="shuffle">🔀</button>
    <button id="repeat">🔁</button>
  </div>

</section>

<section id="panel">

  <label class="file">
    📁 Tambah File
    <input id="files" type="file"
      accept="audio/*,video/mp4,.mp3,.wav,.m4a,.aac"
      multiple>
  </label>

  <div class="search">
    <input id="query" placeholder="Cari musik di YouTube...">
    <button id="searchBtn">Cari</button>
  </div>

  <div id="results"></div>


  <!-- BAR CARI SOUNDCLOUD + TOMBOL TUTUP -->
    <div class="search" id="boxSC">
        <input id="searchSCInput" placeholder="Cari di SoundCloud...">
        <button id="searchSCBtn">Cari SC</button>
        <button id="btnTutupSC" style="margin-left:5px; background:#ff4d4d;">✖</button>
    </div>
  
</section>

<section class="library">

  <div class="libhead">
    <div>
      <h3>Library</h3>
      <small id="count">0 lagu</small>
    </div>
    <button id="clear">Hapus</button>
  </div>

  <div id="playlist"></div>

</section>

<audio id="audio" playsinline preload="metadata"></audio>
<div id="youtubePlayer"></div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>

<!-- RADIO PAKAI IFRAME - 100% TERPISAH -->
<button id="btnBukaRadio" style="width:100%; padding:12px; margin:12px 0; background:#1DB954; color:#000; border:none; border-radius:12px; font-weight:700; font-size:16px;">
  📻 Buka Radio Hits
</button>

<div id="boxRadioAjg" style="display:none; background:#111; padding:12px; border-radius:16px; margin:12px 0;">
  <iframe src="https://onlineradiobox.com/id/" width="100%" height="420" frameborder="0" allow="autoplay" style="border-radius:12px;"></iframe>
  <button id="btnTutupRadio" style="width:100%; margin-top:10px; padding:8px; background:#333; color:#fff; border:none; border-radius:8px;">Tutup</button>
</div>

<script>
// JS RADIO DIPISAH BIAR GA BANTAI script.js
document.getElementById('btnBukaRadio').onclick = function(){
  document.getElementById('boxRadioAjg').style.display = 'block';
}
document.getElementById('btnTutupRadio').onclick = function(){
  document.getElementById('boxRadioAjg').style.display = 'none';
}
</script>
</body>
</html>
